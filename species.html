<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>All species | Venomous Snakes Explained</title>
<meta name="description" content="All 94 venomous snakes on this site, with both scores. Search, filter and sort.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;600;700&family=Zilla+Slab:ital,wght@0,500;0,600;0,700;1,500&display=swap">
<link rel="stylesheet" href="site.css">
<style>
  .controls { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: end; }
  .controls label { display: grid; gap: 4px; font-size: 0.78rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .controls input, .controls select { font: 400 0.95rem var(--font-body); padding: 8px 10px; border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); color: var(--ink); min-width: 0; }
  .controls input { width: min(320px, 100%); }
  th button { all: unset; cursor: pointer; }
  th button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  th button[aria-sort="ascending"]::after { content: " ↑"; }
  th button[aria-sort="descending"]::after { content: " ↓"; }
  #list tbody tr { cursor: pointer; }
  #list tbody tr:hover { background: var(--accent-soft); }
  #list td a { color: var(--ink); text-decoration: none; font-weight: 600; }
  .muted { color: var(--muted); }
</style>
</head>
<body data-page="species.html">
<script src="data.js"></script>
<script src="common.js"></script>
<main>
  <section class="col">
    <span class="eyebrow">Browse</span>
    <h1>All species</h1>
    <p class="lede">Every snake in our dataset, with both scores. Sort by any column, or search by common or scientific name.</p>
  </section>
  <section>
    <div class="controls">
      <label for="q">Search<input id="q" type="search" placeholder="e.g. cobra or Naja" autocomplete="off"></label>
      <label for="fam">Family<select id="fam"><option value="">All families</option><option value="Elapidae">Elapids</option><option value="Viperidae">Vipers</option><option value="Colubridae">Rear-fanged colubrids</option></select></label>
      <span class="caption" id="count"></span>
    </div>
    <div class="table-wrap">
      <table id="list">
        <thead><tr>
          <th><button type="button" data-k="common">Species</button></th>
          <th><button type="button" data-k="region">Region</button></th>
          <th class="r"><button type="button" data-k="vh">Venom Hazard</button></th>
          <th class="r"><button type="button" data-k="hr">Human Risk</button></th>
          <th class="r"><button type="button" data-k="comb" aria-sort="descending">Combined</button></th>
          <th><button type="button" data-k="grade">Grade</button></th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>
</main>
<script>
(function () {
  var S = SPECIES.slice(), key = "comb", dir = -1;
  var slug = function (sci) { return "sp-" + sci.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") + ".html"; };
  var tb = document.querySelector("#list tbody");
  function val(s, k) { var v = s[k]; if (k === "vh" || k === "hr" || k === "comb") return typeof v === "number" ? v : null; return v == null ? null : String(v).toLowerCase(); }
  function render() {
    var q = document.getElementById("q").value.trim().toLowerCase(), f = document.getElementById("fam").value;
    var rows = S.filter(function (s) {
      return (!f || s.family === f) && (!q || (s.common + " " + s.sci + " " + (s.other || "")).toLowerCase().indexOf(q) >= 0);
    }).sort(function (a, b) {
      var x = val(a, key), y = val(b, key);
      if (x === null && y === null) return a.common.localeCompare(b.common);
      if (x === null) return 1; if (y === null) return -1;
      return (x < y ? -1 : x > y ? 1 : 0) * dir;
    });
    var cell = function (v) { return typeof v === "number" ? fmt(v) : '<span class="muted">–</span>'; };
    tb.innerHTML = rows.map(function (s) {
      return '<tr data-href="' + slug(s.sci) + '"><td><a href="' + slug(s.sci) + '">' + s.common + '</a><br><span class="sci muted">' + s.sci + '</span></td><td>' + (s.region || "") +
        '</td><td class="r num">' + cell(s.vh) + '</td><td class="r num">' + cell(s.hr) + '</td><td class="r num">' + cell(s.comb) + '</td><td>' +
        (s.grade ? '<span class="tier ' + s.grade + '">' + s.grade + "</span>" : '<span class="muted">–</span>') + "</td></tr>";
    }).join("");
    document.getElementById("count").textContent = rows.length + " of " + S.length + " species";
  }
  document.querySelectorAll("th button").forEach(function (b) {
    b.addEventListener("click", function () {
      var k = b.getAttribute("data-k");
      if (k === key) dir = -dir; else { key = k; dir = (k === "vh" || k === "hr" || k === "comb") ? -1 : 1; }
      document.querySelectorAll("th button").forEach(function (o) { o.removeAttribute("aria-sort"); });
      b.setAttribute("aria-sort", dir === 1 ? "ascending" : "descending");
      render();
    });
  });
  tb.addEventListener("click", function (e) { var tr = e.target.closest("tr"); if (tr && !e.target.closest("a")) location.href = tr.getAttribute("data-href"); });
  document.getElementById("q").addEventListener("input", render);
  document.getElementById("fam").addEventListener("change", render);
  render();
})();
</script>
</body>
</html>
